# Used by scripts/smoke.sh and scripts/load.sh only: the production image with the production hardening and
# the production resource limits, on a throw-away project.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ludo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run through scripts/smoke.sh}
      POSTGRES_DB: ludo_db
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_min_duration_statement=500
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludo -d ludo_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${SMOKE_IMAGE:?run through scripts/smoke.sh}
    environment:
      DATABASE_URL: postgresql://ludo:${POSTGRES_PASSWORD}@postgres:5432/ludo_db
      JWT_SECRET: ${JWT_SECRET:?}
      NODE_ENV: production
      PORT: 4002
      CLIENT_URL: https://ludo.example.test
      ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 900m
    cpus: 1.0

volumes:
  uploads_data:
